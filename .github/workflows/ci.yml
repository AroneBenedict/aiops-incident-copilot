name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install PyTorch (CPU build)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: pytest --cov --cov-fail-under=90
      - name: Pipeline smoke run
        run: python -m aiops.pipeline --small --seeds 7 --out smoke-results
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ matrix.python-version }}
          path: smoke-results/

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t aiops-incident-copilot .
